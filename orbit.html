<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MissionForge | Earth Viewer</title>
    <meta name="description" content="A live view of Earth built on NASA GIBS imagery, EONET events and POWER surface weather." />
  </head>
  <body>
    <div id="cesiumContainer"></div>

    <div id="hud">
      <header>
        <h1>Earth Viewer controls</h1>
        <p id="clock">&mdash;</p>
      </header>
      <footer><button id="hud-toggle" type="button">Hide controls</button></footer>
    </div>

<header class="orbit-mast"><a href="/orbit.html"><img src="/forge.svg" alt="">MISSIONFORGE</a><span>Earth Viewer</span><a class="atlas-link" href="/#discover">Open workspace ↗</a></header>
<section id="orbit-intro"><div class="frame-label"><i></i>Earth observation</div><h2>Explore Earth.<br><em>Prepare beyond it.</em></h2><p>Find analog terrain, plan a field mission and test your crew and equipment against real Earth conditions.</p><button id="explore-orbit">Explore the globe　↗</button></section>
<script>document.body.classList.add('intro-open');document.getElementById('explore-orbit').onclick=()=>{document.body.classList.remove('intro-open');document.getElementById('orbit-intro').remove();document.getElementById('hud-toggle').focus()};</script>
<link rel="stylesheet" href="/src/orbit-entry.css">
<aside id="details" hidden></aside>

    <footer id="credits"><span id="map-credits"></span> <span id="event-credit"></span> <span id="detail-credit"></span></footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
