services:
  - type: web
    name: riverhacks-2026
    runtime: node
    plan: free
    buildCommand: ONNXRUNTIME_NODE_INSTALL_CUDA=skip npm ci --include=dev && npm run build
    startCommand: npm start
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /healthz
    envVars:
      # @huggingface/transformers pulls onnxruntime-node, whose install script
      # downloads a ~400 MB CUDA GPU runtime from GitHub. Nothing here uses the
      # GPU build, and on a small instance that download is what fails the
      # build. Skipping it takes install from "fails" to about ten seconds.
      - key: ONNXRUNTIME_NODE_INSTALL_CUDA
        value: skip
      - key: NODE_VERSION
        value: "22"
      # Optional. Without them the app still runs: GIBS imagery, EONET events
      # and POWER surface data need no key at all.
      - key: NASA_API_KEY            # api.nasa.gov - DONKI space weather, APOD
        sync: false
      - key: VITE_CESIUM_ION_ACCESS_TOKEN  # world terrain; read at build time
        sync: false
      - key: SERPAPI_KEY             # optional web-search enrichment
        sync: false
      - key: FIRMS_MAP_KEY           # optional FIRMS active-fire detections
        sync: false
      - key: MISSION_BACKEND_URL     # Python mission API used by planetary analog search
        sync: false
