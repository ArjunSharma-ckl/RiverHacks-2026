<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RiverHacks | Orbit</title>
    <meta name="description" content="A live view of Earth built on NASA GIBS imagery, EONET events and POWER surface weather." />
  </head>
  <body>
    <div id="cesiumContainer"></div>

    <div id="hud">
      <header>
        <h1>Orbit control</h1>
        <p id="clock">&mdash;</p>
      </header>
      <footer><button id="hud-toggle" type="button">Hide controls</button></footer>
    </div>

    <section id="mission" aria-label="Analog mission planning">
      <details>
        <summary>Analog mission</summary>
        <div class="mission-body">
          <a href="/planner.html">Open simulation planner</a>
          <strong id="mission-site">Askja Caldera, Iceland</strong>
          <p id="mission-match" hidden></p>
          <button id="match-reopen" type="button" aria-haspopup="dialog" hidden>Match details</button>
          <button type="button">Fly to Askja</button>
          <label>Test phase <select></select></label>
          <p aria-live="polite"></p>
          <small>Right-drag to tilt · Scroll to zoom</small>
        </div>
      </details>
    </section>
    <aside id="details" hidden></aside>
    <dialog id="analog-evidence" aria-labelledby="analog-title">
      <form method="dialog"><button autofocus>Close</button></form>
      <h2 id="analog-title"></h2>
      <p id="analog-score"></p>
      <div id="earth-relief" class="terrain-view"></div>
      <p id="analog-reason"></p>
      <a id="earth-data-source" target="_blank" rel="noopener">Elevation data source</a>
    </dialog>

    <p id="credits">
      Imagery: NASA EOSDIS GIBS &middot; Events: NASA EONET &middot; Surface data: NASA POWER
      &middot; Space weather: NASA DONKI &middot; Terrain &amp; detail imagery: Cesium ion, Esri
    </p>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
